services:
  messenger:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: https://${DOMAIN}
    volumes:
      - messages:/app/data
    expose:
      - "8787"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - messenger
volumes:
  messages:
  caddy_data:
  caddy_config:
