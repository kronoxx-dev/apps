plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'family.ryadom.app'
    compileSdk 35
    defaultConfig { applicationId 'family.ryadom.app'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.5.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:25.0.1' }
